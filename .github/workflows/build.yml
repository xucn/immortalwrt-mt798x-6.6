name: Build OpenWRT

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache libncurses-dev zlib1g-dev libssl-dev git wget flex bison

      - name: Update feeds
        run: |
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p passwall2

      - name: Configure
        run: |
          cp defconfig/mt7986-ax6000.config .config
          cat >> .config << 'EOF'
CONFIG_PACKAGE_luci-app-turboacc-mtk=y
CONFIG_PACKAGE_turboacc-mtk=y
CONFIG_PACKAGE_frpc=y
CONFIG_PACKAGE_luci-app-frpc=y
CONFIG_PACKAGE_cups=y
CONFIG_PACKAGE_cups-filters=y
CONFIG_PACKAGE_luci-app-cups=y
CONFIG_PACKAGE_kmod-usb-printer=y
CONFIG_PACKAGE_vlmcsd=y
CONFIG_PACKAGE_luci-app-vlmcsd=y
CONFIG_PACKAGE_luci-app-passwall2=y
CONFIG_PACKAGE_passwall2=y
CONFIG_PACKAGE_xray-core=y
CONFIG_PACKAGE_sing-box=y
CONFIG_PACKAGE_hysteria2=y
CONFIG_PACKAGE_v2ray-core=y
CONFIG_PACKAGE_v2ray-geoip=y
CONFIG_PACKAGE_v2ray-geosite=y
CONFIG_PACKAGE_geoview=y
CONFIG_PACKAGE_shadowsocks-rust=y
CONFIG_PACKAGE_shadowsocks-libev=y
CONFIG_PACKAGE_trojan-go=y
CONFIG_PACKAGE_naiveproxy=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_unzip=y
CONFIG_PACKAGE_ip-full=y
CONFIG_PACKAGE_lua=y
CONFIG_PACKAGE_luci-lib-jsonc=y
CONFIG_PACKAGE_luci-compat=y
CONFIG_PACKAGE_resolveip=y
EOF
          make defconfig

      - name: Build
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/mediatek/filogic/*.bin
